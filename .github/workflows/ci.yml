name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  API_BASE_URL: https://engage.invalid
  API_USERNAME: offline-test
  API_PASSWORD: offline-test
  SCHEDULER_ENABLED: "false"
  CLOAKBROWSER_AUTO_UPDATE: "false"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Typecheck, lint, and offline unit tests
        run: bun run check

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RUN_REDIS_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run test:integration
        env:
          TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
      - name: Install browser system dependencies
        run: sudo "$(command -v bun)" node_modules/playwright-core/cli.js install-deps chromium
      - run: bun run browser:install
      - name: Verify real browser authentication against a local fixture
        run: bun run test:browser

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      image-id: ${{ steps.export.outputs.image-id }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate deployment configuration
        id: compose
        env:
          REDIS_PASSWORD: ci-compose-validation
        run: |
          cp example.env .env
          trap 'rm -f .env' EXIT
          sh -n startup.sh
          sh -n scripts/test-watchtower.sh
          docker compose config --quiet
          docker compose --project-name dsas-cca-local -f docker-compose.yaml -f docker-compose.build.yaml config --quiet
          mkdir -p "$RUNNER_TEMP/watchtower-auth"
          printf '{}\n' > "$RUNNER_TEMP/watchtower-auth/config.json"
          WATCHTOWER_AUTH_DIR="$RUNNER_TEMP/watchtower-auth" docker compose -f docker-compose.yaml -f docker-compose.auth.yaml config --quiet
          docker compose config --format json > "$RUNNER_TEMP/compose.json"
          printf 'watchtower-image=%s\n' "$(jq -r '.services.watchtower.image' "$RUNNER_TEMP/compose.json")" >> "$GITHUB_OUTPUT"
          printf 'docker-api-version=%s\n' "$(jq -r '.services.watchtower.environment.DOCKER_API_VERSION' "$RUNNER_TEMP/compose.json")" >> "$GITHUB_OUTPUT"
      - name: Build production image and install verified CloakBrowser
        run: |
          docker build --pull --tag dsas-cca-backend:ci \
            --label org.opencontainers.image.source=https://github.com/JamesFlare1212/dsas-cca-backend \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Launch the baked browser without network access
        run: docker run --rm --init --network none dsas-cca-backend:ci bun run browser:smoke
      - name: Verify Watchtower updates and container selection
        env:
          WATCHTOWER_IMAGE: ${{ steps.compose.outputs.watchtower-image }}
          WATCHTOWER_DOCKER_API_VERSION: ${{ steps.compose.outputs.docker-api-version }}
        run: sh scripts/test-watchtower.sh dsas-cca-backend:ci "$WATCHTOWER_IMAGE"
      - name: Export the tested image for publication
        id: export
        if: >-
          github.event_name == 'push' &&
          github.repository == 'JamesFlare1212/dsas-cca-backend' &&
          !github.event.repository.fork &&
          (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
           github.ref == 'refs/heads/rewrite/bun-cloakbrowser')
        shell: bash
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' dsas-cca-backend:ci)
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
          docker save dsas-cca-backend:ci | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
      - name: Upload the tested image
        id: upload
        if: steps.export.outputs.image-id != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [check, integration, container-smoke]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'JamesFlare1212/dsas-cca-backend' &&
      !github.event.repository.fork &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       github.ref == 'refs/heads/rewrite/bun-cloakbrowser')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jamesflare1212/dsas-cca-backend
    steps:
      - name: Download the tested image from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.container-smoke.outputs.artifact-id }}
          path: ${{ runner.temp }}/tested-image
          merge-multiple: true
      - name: Load and verify the tested image
        shell: bash
        env:
          EXPECTED_IMAGE_ID: ${{ needs.container-smoke.outputs.image-id }}
        run: |
          gzip -dc "$RUNNER_TEMP/tested-image/image.tar.gz" | docker load
          test "$(docker image inspect --format '{{.Id}}' dsas-cca-backend:ci)" = "$EXPECTED_IMAGE_ID"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' dsas-cca-backend:ci)" = "$GITHUB_SHA"
      - name: Publish commit and deployment tags to GHCR
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOCKER_CONFIG: ${{ runner.temp }}/ghcr
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          tags=("sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            tags+=(latest)
          fi
          if [[ "$GITHUB_REF_NAME" == rewrite/bun-cloakbrowser ]]; then
            tags+=(rewrite-bun-cloakbrowser)
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          for tag in "${tags[@]}"; do
            docker tag dsas-cca-backend:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
