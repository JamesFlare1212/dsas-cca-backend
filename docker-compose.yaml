services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /usr/src/app/data
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0"
      CLOAKBROWSER_CACHE_DIR: /opt/cloakbrowser
      CLOAKBROWSER_AUTO_UPDATE: "false"
    volumes:
      - app-data:/usr/src/app/data
    shm_size: 256mb
    restart: unless-stopped
    stop_grace_period: 25s
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "15m"
        max-file: "3"

  redis:
    # Verified against redis/redis's stable release and Docker Official Images.
    image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    user: redis:redis
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    stop_grace_period: 25s
    healthcheck:
      test:
        - CMD-SHELL
        - 'test "$$(REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --raw ping)" = PONG'
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "15m"
        max-file: "3"

volumes:
  app-data:
  redis-data:
